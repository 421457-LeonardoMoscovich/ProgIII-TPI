services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemontcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokemontcg}
      POSTGRES_USER: ${POSTGRES_USER:-pokemontcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemontcg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokemontcg}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
